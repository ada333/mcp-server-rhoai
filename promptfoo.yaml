description: "MCP Server RHOAI - Tool Selection Evaluation"
# the evaluation should cover all the main tools and scenarios
evaluateOptions:
  delay: 2000

prompts:
  - "{{prompt}}"

providers:
  - id: google:gemini-2.5-pro
    config:
      mcp:
        enabled: true
        server:
          command: ./mcp-server-rhoai
          args: ["-mode", "write"]
          name: rhoai

tests:
  # ==================== WORKBENCH LISTING ====================
  - description: "List all workbenches (no namespace)"
    vars:
      prompt: "List all workbenches in cluster"
    assert:
      - type: tool-call-f1
        value:
          - "list_workbenches"

  - description: "List workbenches in specific namespace"
    vars:
      prompt: "List workbenches in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "list_workbenches"
      - type: contains
        value: '"namespace":"test-namespace"'

  # ==================== WORKBENCH CRUD ====================
  - description: "Create a new workbench"
    vars:
      prompt: "Create a workbench with name my-notebook in namespace test-namespace using image 'Jupyter Data Science' with tag 2024.2"
    assert:
      - type: tool-call-f1
        value:
          - "create_workbench"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"workbenchName":"my-notebook"'

  - description: "Update workbench image"
    vars:
      prompt: "Update workbench my-notebook in namespace test-namespace to use image 'PyTorch' with tag 2024.1"
    assert:
      - type: tool-call-f1
        value:
          - "update_workbench"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"workbenchName":"my-notebook"'

  - description: "Delete a workbench"
    vars:
      prompt: "Delete workbench old-notebook in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "delete_workbench"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"workbenchName":"old-notebook"'

  - description: "Stop a workbench"
    vars:
      prompt: "Stop workbench my-notebook in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "change_workbench_status"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"status":1'

  - description: "Start a workbench"
    vars:
      prompt: "Start workbench my-notebook in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "change_workbench_status"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"status":0'

  # ==================== PODS ====================
  - description: "List pods in namespace"
    vars:
      prompt: "List pods in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "list_pods"
      - type: contains
        value: '"namespace":"test-namespace"'

  # ==================== IMAGES ====================
  - description: "Create custom image"
    vars:
      prompt: "Create a custom notebook image with name my-custom-image, location docker.io/myrepo/myimage:latest, and description 'Custom ML image'"
    assert:
      - type: tool-call-f1
        value:
          - "create_custom_image"
      - type: contains
        value: '"imageName":"my-custom-image"'
      - type: contains
        value: 'docker.io/myrepo/myimage:latest'

  - description: "Update image"
    vars:
      prompt: "Update image my-custom-image with new description 'Updated ML image for production'"
    assert:
      - type: tool-call-f1
        value:
          - "update_image"
      - type: contains
        value: '"imageName":"my-custom-image"'

  - description: "Delete image"
    vars:
      prompt: "Delete image old-image"
    assert:
      - type: tool-call-f1
        value:
          - "delete_image"
      - type: contains
        value: '"imageName":"old-image"'

  # ==================== HARDWARE PROFILES ====================
  - description: "Create hardware profile"
    vars:
      prompt: "Create hardware profile named gpu-large with resources: CPU (resourceName: CPU, identifier: cpu, type: cpu, default: 4, min: 1, max: 8) and Memory (resourceName: Memory, identifier: memory, type: memory, default: 16Gi, min: 4Gi, max: 32Gi)"
    assert:
      - type: tool-call-f1
        value:
          - "create_hardware_profile"
      - type: contains
        value: '"hardwareProfileName":"gpu-large"'

  - description: "Update hardware profile"
    vars:
      prompt: "Update hardware profile gpu-large with CPU resource (resourceName: CPU, identifier: cpu, type: cpu, default: 8, min: 2, max: 16)"
    assert:
      - type: tool-call-f1
        value:
          - "update_hardware_profile"
      - type: contains
        value: '"hardwareProfileName":"gpu-large"'

  - description: "Delete hardware profile"
    vars:
      prompt: "Delete hardware profile old-profile"
    assert:
      - type: tool-call-f1
        value:
          - "delete_hardware_profile"
      - type: contains
        value: '"hardwareProfileName":"old-profile"'

  # ==================== STORAGE (PVCs) ====================
  - description: "List PVCs in namespace"
    vars:
      prompt: "List all PVCs in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "list_pvcs"
      - type: contains
        value: '"namespace":"test-namespace"'

  - description: "Create PVC"
    vars:
      prompt: "Create a PVC named my-storage with size 20Gi in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "create_pvc"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"pvcName":"my-storage"'
      - type: contains
        value: '"size":"20Gi"'

  - description: "Update PVC size"
    vars:
      prompt: "Update PVC my-storage in namespace test-namespace to size 50Gi"
    assert:
      - type: tool-call-f1
        value:
          - "update_pvc"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"pvcName":"my-storage"'
      - type: contains
        value: '"size":"50Gi"'

  # ==================== RESOURCE CONSUMPTION ====================
  - description: "Get resource consumption for namespace"
    vars:
      prompt: "Show resource consumption for namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "list_resource_consumption_per_namespace"
      - type: contains
        value: '"namespace":"test-namespace"'

  - description: "Resource usage per workbench"
    vars:
      prompt: "Show resource consumption for workbench my-notebook in namespace test-namespace"
    assert:
      - type: tool-call-f1
        value:
          - "list_resource_consumption_per_workbench"
      - type: contains
        value: '"namespace":"test-namespace"'
      - type: contains
        value: '"workbenchName":"my-notebook"'

  - description: "Resource consumption by user"
    vars:
      prompt: "Show resource consumption for user john@example.com"
    assert:
      - type: tool-call-f1
        value:
          - "list_resource_consumption_per_user"
      - type: contains
        value: '"user":"john@example.com"'

  - description: "Cluster-wide resource usage"
    vars:
      prompt: "Show resource consumption for the entire cluster"
    assert:
      - type: tool-call-f1
        value:
          - "list_resource_consumption_per_cluster"

  - description: "Total cluster resources"
    vars:
      prompt: "What is the cluster-wide resource usage?"
    assert:
      - type: tool-call-f1
        value:
          - "list_resource_consumption_per_cluster"

outputPath: ./promptfoo-results.json
